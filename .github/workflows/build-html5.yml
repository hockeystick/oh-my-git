name: Build HTML5 for Vercel

on:
  push:
    branches:
      - main
      - claude/prepare-vercel-deployment-*
  workflow_dispatch:

env:
  GODOT_VERSION: 3.5.3

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:3.5.3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Godot templates
        run: |
          mkdir -p ~/.local/share/godot/templates
          mv /root/.local/share/godot/templates/${GODOT_VERSION}.stable ~/.local/share/godot/templates/${GODOT_VERSION}.stable

      - name: Build HTML5
        run: |
          mkdir -p build/html5
          godot --export "HTML5" build/html5/index.html

      - name: Verify build output
        run: |
          ls -la build/html5/
          echo "Build files created:"
          find build/html5/ -type f

      - name: Commit and push build
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory /__w/oh-my-git/oh-my-git
          git add build/html5/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Build: Generate HTML5 build for Vercel deployment [skip ci]"
            git push
          fi
