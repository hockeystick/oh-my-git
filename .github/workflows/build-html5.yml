name: Build HTML5 for Vercel

on:
  push:
    branches:
      - main
      - claude/prepare-vercel-deployment-*
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Download Godot
        run: |
          wget https://github.com/godotengine/godot/releases/download/3.5.3-stable/Godot_v3.5.3-stable_linux_headless.64.zip
          unzip Godot_v3.5.3-stable_linux_headless.64.zip
          chmod +x Godot_v3.5.3-stable_linux_headless.64

      - name: Download Godot Export Templates
        run: |
          wget https://github.com/godotengine/godot/releases/download/3.5.3-stable/Godot_v3.5.3-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/templates/3.5.3.stable
          unzip Godot_v3.5.3-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/templates/3.5.3.stable/

      - name: Build HTML5
        run: |
          mkdir -p build/html5
          ./Godot_v3.5.3-stable_linux_headless.64 --export "HTML5" build/html5/index.html

      - name: Copy to public directory for Vercel
        run: |
          mkdir -p public
          cp -r build/html5/* public/

      - name: Verify build output
        run: |
          ls -la public/
          echo "Build files created:"
          find public/ -type f

      - name: Commit and push build
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f build/html5/ public/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Build: Generate HTML5 build for Vercel deployment [skip ci]"
            git push
          fi
